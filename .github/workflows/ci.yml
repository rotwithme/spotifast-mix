name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Dependencies come only from crates.io or from crmne repositories,
  # review evidence (captures, comparison pages, recordings) stays in the pull
  # request instead of the tree, and a pull request adds no setting without
  # the maintainer's approval. See CONTRIBUTING.md.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Dependency sources
        run: python3 .github/scripts/check-dependency-sources.py
      - name: No review evidence in the tree
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-review-evidence.py
      - name: Policy check regressions
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/test-policy-checks.py
      # Pull requests only: the maintainer's own commits on main are not
      # checked. The label is read when the job runs, so after adding
      # setting-approved, re-run this job.
      - name: New settings need approval
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          approved=()
          if grep -qx setting-approved <<< "$labels"; then approved=(--approved); fi
          python3 .github/scripts/check-new-settings.py --base "$BASE" "${approved[@]}"

  # Every repository on the account shares the hosted runners, so a pull
  # request tests on Linux and Windows, and macOS and Windows on ARM join on
  # main and when ci-scope.py says the change needs them. A change to the
  # docs alone skips the Rust lints and the Nix package. This job is not a
  # required check, so a skipped one never blocks a merge. After adding the
  # all-platforms label to a pull request, re-run all its jobs.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      platforms: ${{ steps.scope.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/ci-scope.py --repo "$GITHUB_REPOSITORY"
          --event "${{ github.event_name }}"
          --pr "${{ github.event.pull_request.number }}"
          --before "${{ github.event.before }}" --after "${{ github.sha }}"

  quality:
    name: quality
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev ruby
      # After the toolchain, so the cache key follows the pinned rustc. The
      # key carries no job name, so each job sets its own generation. Only
      # pushes to main save; a pull request restores and builds on top.
      # Letting every branch save its own copy filled the repository's
      # ten-gigabyte cache in a few days, and a full cache evicts the entry
      # the next build wanted.
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: quality-v1
      - name: Formatting
        run: cargo fmt --all --check
      - name: Flatpak release metadata regression tests
        run: python3 packaging/flatpak/test-metainfo.py
      - name: Linux launcher packaging regressions
        run: python3 packaging/test-launchers.py
      - name: Release name migration regressions
        run: python3 packaging/test-release-names.py
      - name: Fork packaging and publication boundaries
        run: python3 packaging/windows/test-mix-packaging.py
      - name: Clippy (default features)
        run: mbx clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        run: mbx clippy --locked --all-targets --all-features -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: mbx doc --locked --all-features --no-deps

  test:
    name: test (${{ matrix.os }})
    needs: scope
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    # A cold mbx cache on Windows (projectM through cmake) needs about 30
    # minutes before the action saves the cache; warm runs take far less.
    # The arm64 runner has four cores and needs longer from cold.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm is the only place the Windows on ARM build is
        # tested, so it runs on every push to main.
        os: ${{ fromJSON(needs.scope.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # These source fixtures need no compiled app. Fail before expensive
      # native builds if a shell or packaging boundary regresses.
      - name: Fork installer isolation regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python packaging\windows\test-mix-packaging.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev
      # libprojectM reads OpenGL through GLEW on Windows; projectm-sys builds
      # against vcpkg's static-CRT triplet, matching .cargo/config.toml.
      - name: GLEW for libprojectM
        if: runner.os == 'Windows'
        run: vcpkg install glew:${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-windows-static
      # projectm-sys asks CMake for the Visual Studio generator, which the
      # runner image no longer satisfies; Ninja inside the MSVC environment
      # builds the same thing without caring which Visual Studio is on. The
      # generator is job-level env, since a GITHUB_ENV write never reached
      # the build script.
      # Native tools on each runner: the action's default is x64, which on
      # the arm64 runner would compile under emulation.
      - name: MSVC environment for libprojectM
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-v1
      # The demo feature carries the headless render test that lays out every
      # page, panel, and dialog without a display.
      - name: Tests (default features)
        run: mbx test --locked --all-targets
      - name: Tests (all features)
        run: mbx test --locked --all-targets --all-features
      - name: Native credential store (dummy grants)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        timeout-minutes: 2
        run: mbx test --locked --lib credentials::tests::native_store_round_trip -- --ignored --exact
      - name: Documentation tests
        run: mbx test --locked --all-features --doc
      # A build can pass while importing Microsoft's C++ runtime, then fail on
      # a clean user's machine. Inspect the executable CI actually produced.
      - name: Standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mbx build --locked
          $imports = & dumpbin /dependents target\debug\spotifast-mix.exe | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Spotifast Mix imports an MSVC runtime:`n$runtime" }
          $machine = if ($env:RUNNER_ARCH -eq 'ARM64') { 'AA64 machine \(ARM64\)' } else { '8664 machine \(x64\)' }
          $headers = & dumpbin /headers target\debug\spotifast-mix.exe | Out-String
          if ($headers -notmatch $machine) { throw "spotifast-mix.exe is not built for $env:RUNNER_ARCH`:`n$headers" }

      - name: Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          & packaging\windows\package-mix.ps1 -NoBuild -Target $target -BinaryPath target\debug\spotifast-mix.exe -OutputDirectory "$env:RUNNER_TEMP\spotifast-mix-portable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\spotifast-mix-portable" -Filter '*.zip'
          if (@($archive).Count -ne 1) { throw 'Expected one portable ZIP.' }
          $checksum = (Get-Content -LiteralPath ($archive.FullName + '.sha256')).Split(' ')[0]
          if ((Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $checksum) { throw 'Portable checksum mismatch.' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'spotifast-mix-portable-check'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $unpacked
          $top = @(Get-ChildItem -LiteralPath $unpacked)
          if ($top.Count -ne 1 -or -not $top[0].PSIsContainer -or $top[0].Name -ne $archive.BaseName) { throw 'Expected one versioned portable directory.' }
          $payload = Join-Path $unpacked $archive.BaseName
          $expected = @('Getting started.md','LICENSE','README.md','spotifast-mix-portable.txt','spotifast-mix.exe') | Sort-Object
          $contents = Get-ChildItem -LiteralPath $payload
          if ($contents | Where-Object PSIsContainer) { throw 'Profiles or unexpected directories in portable ZIP.' }
          $actual = $contents | Select-Object -ExpandProperty Name | Sort-Object
          if (Compare-Object $expected $actual) { throw 'Unexpected files in portable ZIP.' }
          & (Join-Path $payload 'spotifast-mix.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: macOS bundle identity and helper startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mbx build --locked
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          app="$RUNNER_TEMP/spotifast-mix-bundle-check/Spotifast Mix.app"
          bash packaging/macos/bundle.sh target/debug/spotifast-mix "$app" "$version"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          "$app/Contents/MacOS/$executable" --version
          # This custom build rejects update helpers before any app/profile work.
          set +e
          "$app/Contents/MacOS/$executable" --apply-update "$RUNNER_TEMP/spotifast-mix-missing-job.json" 2> "$RUNNER_TEMP/spotifast-mix-helper-check.log"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F 'unexpected argument' "$RUNNER_TEMP/spotifast-mix-helper-check.log"

  nix:
    name: Nix package
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: wimpysworld/nothing-but-nix@v9
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Read the public Nix cache
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - run: nix build .#default
      # This unpublished fork validates locally and never uploads a closure.

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: docs

      - name: Build documentation site
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --destination "$RUNNER_TEMP/spotifast-mix-site"
