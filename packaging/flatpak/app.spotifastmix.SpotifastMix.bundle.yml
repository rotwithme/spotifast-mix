# The release workflow's Flatpak: the binary the Linux job built, packaged
# into the same sandbox as app.spotifastmix.SpotifastMix.yml describes. The
# job unpacks the release tarball into built/ beside this file first.
id: app.spotifastmix.SpotifastMix
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: spotifast-mix
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  # Platform storage for this application's Spotify grants.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.spotifast-mix
  - --persist=.local/state
modules:
  - name: spotifast-mix
    buildsystem: simple
    build-commands:
      - install -Dm755 spotifast-mix /app/bin/spotifast-mix
      - install -Dm644 packaging/applications/*.desktop /app/share/applications/app.spotifastmix.SpotifastMix.desktop
      - sed -i 's/^Icon=.*$/Icon=app.spotifastmix.SpotifastMix/;s/^StartupWMClass=spotifast-mix$/StartupWMClass=app.spotifastmix.SpotifastMix/' /app/share/applications/app.spotifastmix.SpotifastMix.desktop
      - install -Dm644 packaging/icons/*.svg /app/share/icons/hicolor/scalable/apps/app.spotifastmix.SpotifastMix.svg
      - install -Dm644 packaging/flatpak/app.spotifastmix.SpotifastMix.metainfo.xml /app/share/metainfo/app.spotifastmix.SpotifastMix.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/spotifast-mix/LICENSE
    sources:
      - type: dir
        path: built
      # Metainfo belongs to this packaging checkout, not the portable archive.
      - type: file
        path: app.spotifastmix.SpotifastMix.metainfo.xml
        dest: packaging/flatpak
